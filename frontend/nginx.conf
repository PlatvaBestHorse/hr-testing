map $request_uri $hr_log_request {
    default 1;
    ~^/i/ 0;
    ~^/api/v1/invite/ 0;
}
server {
    client_max_body_size 6m;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/access.log combined if=$hr_log_request;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Nginx upstream errors contain request URLs: suppress them for bearer links.
    # Safe application errors remain available in the API log.
    location ^~ /api/v1/invite/ {
        error_log /dev/null;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
