limit_req_zone $binary_remote_addr zone=candidate_requests:10m rate=20r/s;
map $request_uri $hr_log_request {
    default 1;
    ~^/i/ 0;
    ~^/api/v1/invite/ 0;
}
server {
    client_max_body_size 6m;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/access.log combined if=$hr_log_request;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Nginx upstream errors contain request URLs: suppress them for bearer links.
    # Safe application errors remain available in the API log.
    location ^~ /api/v1/invite/ {
        limit_req zone=candidate_requests burst=100 nodelay;
        limit_req_status 429;
        error_page 429 = @candidate_rate_limited;
        error_log /dev/null;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @candidate_rate_limited {
        error_log /dev/null;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        return 429 '{"code":"rate_limited","message":"Слишком много запросов. Повторите через минуту"}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
