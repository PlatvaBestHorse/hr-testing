      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Точный origin интерфейса из APP_ORIGINS
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Токен текущей сессии из /me
      requestBody:
        required: true
