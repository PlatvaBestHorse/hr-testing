  /api/v1/invite/{token}/start:
    post:
      operationId: startAttempt
      summary: Начало или восстановление попытки
      security: []
      description: request_id обеспечивает повторяемость. Активная попытка всегда
        восстанавливается; без new_attempt=true завершённая не заменяется новой. Срок
        и лимит проверяются PostgreSQL после блокировки приглашения. Согласие development-passage-v1
        предназначено для тестового контура.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
        description: Секрет ссылки; исключить URL из логов.
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
