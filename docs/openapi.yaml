  /api/v1/retention/previews/{id}/apply:
    post:
      operationId: applyRetention
      summary: Применить подтверждённую очистку
      description: Только org_admin своей организации. Список должен принадлежать
        текущему администратору/организации, быть действительным и соответствовать
        версии включённых правил. Права повторно проверяются после ожидания блокировки.
        Перед удалением проверяется актуальная пригодность каждой выбранной карточки.
        ФИО/контакты удаляются, ссылки отзываются, адреса сообщений заменяются redacted,
        pending/failed сообщения отменяются, согласия удаляются. Баллы и ответы сохраняются.
        Старый аудит удаляет узкая DB-функция с проверкой действующей админ-сессии.
        Операция атомарна; повтор ID возвращает прежний результат. Новые после предпросмотра
        записи не затрагиваются. Действия и итог аудируются.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
