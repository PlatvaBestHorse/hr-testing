        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAttemptInput'
  /api/v1/invite/{token}/attempt:
    get:
      operationId: getAttempt
      summary: Восстановление последней попытки
      security: []
      description: Нет попытки — 404. Возвращает подтверждённые ответы и постоянный
        порядок, автоматически завершает просроченную. Завершённый результат доступен
        после срока ссылки до отзыва; архив кандидата/организации блокирует доступ.
        score присутствует только после завершения при включённом show_candidate_score;
        финальные items пусты.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
        description: Секрет ссылки; исключить URL из логов.
      responses:
        '200':
          description: Подтверждено сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAttempt'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/invite/{token}/attempts/{id}/items/{item}/answer:
    put:
      operationId: saveAnswer
      summary: Атомарное сохранение ответа
      security: []
      description: expected_revision=0 для первого ответа. Только варианты этого задания;
        пустой массив очищает ответ. 409 revision_conflict не перезаписывает другую
        вкладку. Повтор request_id с тем же содержимым возвращает прежнюю квитанцию,
        даже после завершения; новое содержимое под тем же ID даёт 409. После дедлайна
        новые ответы не принимаются.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
        description: Секрет ссылки; исключить URL из логов.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: item
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Подтверждено сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerReceipt'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInput'
  /api/v1/invite/{token}/attempts/{id}/submit:
    post:
      operationId: submitAttempt
      summary: Идемпотентное завершение и оценивание
      security: []
      description: Перед дедлайном submitted, после него expired; учитываются только
        уже сохранённые ответы. Баллы только за полное совпадение множества; округление
        процента до двух знаков, passed по округлённому проценту. Повтор не меняет
        время или результат.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
        description: Секрет ссылки; исключить URL из логов.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Подтверждено сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAttempt'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptySubmit'
  /api/v1/results:
    get:
      operationId: listResults
      summary: Прохождения и баллы для HR
      description: Сессия своей организации; assessor только назначенные вакансии.
        Поиск буквальный по кандидату/тесту/вакансии, даты начала по МСК, 20 строк
        на страницу. Выгрузка использует те же фильтры.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: search
        in: query
        schema:
          type: string
          maxLength: 500
      - name: status
        in: query
        schema:
          type: string
          enum:
          - in_progress
          - submitted
          - expired
          - cancelled
      - name: passed
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: date_from
        in: query
        schema:
          type: string
          format: date
        description: 'По времени начала: календарные дни МСК (+03:00); обе границы
          включены.'
      - name: date_to
        in: query
        schema:
          type: string
          format: date
        description: 'По времени начала: календарные дни МСК (+03:00); обе границы
          включены.'
      - name: candidate_id
        in: query
        schema:
          type: string
          format: uuid
      - name: test_id
        in: query
        schema:
          type: string
          format: uuid
      - name: vacancy_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/results/{id}:
    get:
      operationId: getResultReport
      summary: Подробный отчёт завершённой попытки
      description: 'Проверяются организация и назначение оценщика. Активная/отменённая
        попытка — 409 report_pending. Только HR: правильные варианты, собственные
        ответы кандидата, пояснения, баллы и категории. categories_frozen=false у
        старых заданий без снимка категории, их категория берётся из текущего банка.
        Суммы/проценты баллов рассчитываются в сотых. Просмотр записывается в аудит.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptReport'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/results/export:
    get:
      operationId: exportResults
      summary: Экспорт выбранного диапазона результатов
      description: Все страницы с теми же фильтрами и правами, максимум 10 000 строк;
        больше — 422 export_limit без частичного файла. Незавершённые попытки экспортируются
        без баллов. UTF-8 BOM, CSV с разделителем ; и десятичной запятой; текст защищён
        от формул. XLSX содержит literal inline strings, числовые баллы и ни одной
        формулы. Content-Disposition attachment, no-store. Успешная подготовка/выдача
        записывается в аудит.
      parameters:
      - name: search
        in: query
        schema:
          type: string
          maxLength: 500
      - name: status
        in: query
        schema:
          type: string
          enum:
          - in_progress
          - submitted
          - expired
          - cancelled
      - name: passed
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: date_from
        in: query
        schema:
          type: string
          format: date
        description: 'По времени начала: календарные дни МСК (+03:00); обе границы
          включены.'
      - name: date_to
        in: query
        schema:
          type: string
          format: date
        description: 'По времени начала: календарные дни МСК (+03:00); обе границы
          включены.'
      - name: candidate_id
        in: query
        schema:
          type: string
          format: uuid
      - name: test_id
        in: query
        schema:
          type: string
          format: uuid
      - name: vacancy_id
        in: query
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        schema:
          type: string
          enum:
          - csv
          - xlsx
          default: csv
      responses:
        '200':
          description: Файл
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/results/{id}/export:
    get:
      operationId: exportResultReport
      summary: Экспорт подробного отчёта
      description: CSV содержит строки ответов с итогом; XLSX — листы Результаты,
        Категории, Ответы. Только завершённые попытки. UTF-8 BOM, CSV с разделителем
        ; и десятичной запятой; текст защищён от формул. XLSX содержит literal inline
        strings, числовые баллы и ни одной формулы. Content-Disposition attachment,
        no-store. Успешная подготовка/выдача записывается в аудит.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        schema:
          type: string
          enum:
          - csv
          - xlsx
          default: csv
      responses:
        '200':
          description: Файл
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
components:
  responses:
    Ready:
      description: База доступна, миграции применены
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Идентификатор запроса
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                const: ready
    Unavailable:
      description: База недоступна или миграции не завершены; сведения подключения
        не раскрываются
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            - code
            properties:
              status:
                type: string
                const: unavailable
              code:
                type: string
                const: database_unavailable
    Error400:
      description: Некорректный JSON, поля или фильтр
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Требуется вход или сессия завершена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Недостаточно прав, неверный Origin или CSRF
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Объект не найден в своей организации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Конфликт, объект используется или версия устарела
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: Ожидается application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Ошибка проверки полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: 'Лимит входа; Retry-After: 900'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Ошибка сервера без раскрытия сведений БД
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hr_session
      description: HttpOnly cookie. Изменяющие запросы также требуют Origin и X-CSRF-Token
        из /me.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
      - code
      - message
    Me:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        csrf_token:
          type: string
          minLength: 64
          maxLength: 64
      required:
      - user_id
      - organization_id
      - organization_name
      - display_name
      - email
      - role
      - csrf_token
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024
          writeOnly: true
          description: Максимум 1024 UTF-8 байта
        organization_slug:
          type: string
          maxLength: 80
      required:
      - email
      - password
    Category:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
      required:
      - id
      - name
      - description
    CategoryInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 2000
      required:
      - name
    Option:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 2000
        is_correct:
          type: boolean
      required:
      - label
      - is_correct
    QuestionInput:
      type: object
      additionalProperties: false
      properties:
        category_id:
          type: string
          description: UUID своей категории или пустая строка
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        type:
          type: string
          enum:
          - single_choice
          - multiple_choice
          - verbal_tfu
        body:
          type: string
          minLength: 1
          maxLength: 10000
        passage:
          type: string
          maxLength: 20000
        explanation:
          type: string
          maxLength: 10000
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/Option'
        base_version_no:
          type: integer
          minimum: 0
          description: Для новой редакции обязательный актуальный номер предыдущей
            версии
      required:
      - difficulty
      - type
      - body
      - options
    VersionInfo:
      type: object
      additionalProperties: false
      properties:
        version_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - draft
          - published
        created_at:
          type: string
          format: date-time
      required:
      - version_no
      - status
      - created_at
    QuestionSaved:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
      required:
      - id
      - version_no
    Publication:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - published
      required:
      - id
      - version_no
      - status
    PublicationInput:
      type: object
      additionalProperties: false
      properties:
        base_version_no:
          type: integer
          minimum: 1
      required:
      - base_version_no
    Member:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        status:
          type: string
          enum:
          - active
          - invited
          - disabled
      required:
      - id
      - email
      - display_name
      - role
      - status
    MemberInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        display_name:
          type: string
          minLength: 1
          maxLength: 250
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: Минимум 12 символов, максимум 1024 UTF-8 байта
      required:
      - email
      - display_name
      - role
      - password
    MemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        status:
          type: string
          enum:
          - active
          - disabled
      required:
      - role
      - status
    Summary:
      type: object
      additionalProperties: false
      properties:
        questions:
          type: integer
          minimum: 0
        tests:
          type: integer
          minimum: 0
        candidates:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0
      required:
      - questions
      - tests
      - candidates
      - attempts
    Question:
      type: object
      additionalProperties: false
      properties:
        category_id:
          type: string
          description: UUID своей категории или пустая строка
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        type:
          type: string
          enum:
          - single_choice
          - multiple_choice
          - verbal_tfu
        body:
          type: string
          minLength: 1
          maxLength: 10000
        passage:
          type: string
          maxLength: 20000
        explanation:
          type: string
          maxLength: 10000
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/Option'
        id:
          type: string
          format: uuid
        category_name:
          type: string
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        version_id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        latest_version_no:
          type: integer
          minimum: 1
        version_status:
          type: string
          enum:
          - draft
          - published
        created_at:
          type: string
          format: date-time
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionInfo'
      required:
      - category_id
      - difficulty
      - type
      - body
      - passage
      - explanation
      - options
      - id
      - category_name
      - status
      - version_id
      - version_no
      - latest_version_no
      - version_status
      - created_at
      - versions
    QuestionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          const: 20
      required:
      - items
      - total
      - page
      - page_size
    CategoryList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - items
    MemberList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
      required:
      - items
    TestItemInput:
      type: object
      additionalProperties: false
      properties:
        question_version_id:
          type: string
          format: uuid
        points:
          type: string
          pattern: ^[0-9]{1,6}(\.[0-9]{1,2})?$
          description: Точная десятичная строка; максимум 2 знака после точки
      required:
      - question_version_id
      - points
    TestInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 250
        description:
          type: string
          maxLength: 10000
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 28800
        pass_percent:
          type: string
          pattern: ^[0-9]{1,6}(\.[0-9]{1,2})?$
          description: Точная десятичная строка; максимум 2 знака после точки
        shuffle_questions:
          type: boolean
        shuffle_options:
          type: boolean
        show_candidate_score:
          type: boolean
        base_version_no:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TestItemInput'
      required:
      - title
      - duration_seconds
      - pass_percent
      - items
    TestVersionInput:
      allOf:
      - $ref: '#/components/schemas/TestInput'
      - type: object
        required:
        - base_version_no
        properties:
          base_version_no:
            type: integer
            minimum: 1
    TestItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        question_version_no:
          type: integer
          minimum: 1
        body:
          type: string
        type:
          type: string
          enum:
          - single_choice
          - multiple_choice
          - verbal_tfu
        position:
          type: integer
        points:
          type: string
      required:
      - question_id
      - question_version_id
      - question_version_no
      - body
      - type
      - position
      - points
    TestRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - archived
        version_id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        latest_version_no:
          type: integer
          minimum: 1
        version_status:
          type: string
          enum:
          - draft
          - published
          - archived
        title:
          type: string
        description:
          type: string
        duration_seconds:
          type: integer
        pass_percent:
          type: string
        shuffle_questions:
          type: boolean
        shuffle_options:
          type: boolean
        show_candidate_score:
          type: boolean
        question_count:
          type: integer
          minimum: 0
        max_points:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestItem'
