  /api/v1/import/questions/preview:
    post:
      operationId: legacyImportPreview
      summary: Проверка CandidateTester version 1 без изменения банка
      description: Только org_admin своей организации. source_sha256 считается от канонического типизированного
        JSON. Все вопросы публикуются; published, shuffle и showScore тестов сохраняются. Импорт ограничен
        single; неизвестные поля и дубли JSON-ключей отклоняются. Исходный файл не сохраняется API.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportInput'
      responses:
        '200':
          description: Предварительный отчёт без записи предметных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
        '400':
          description: Неверный JSON или тело более 512 КиБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Сессия завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Требуются org_admin, Origin и CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Нужен application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 2 одновременных импорта; 30 запросов на аккаунт/организацию и 120 на IP за 15 минут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка; транзакция не применена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/import/questions/apply:
    post:
      operationId: legacyImportApply
      summary: Подтверждённый атомарный импорт вопросов и тестов
      description: Только org_admin своей организации. source_sha256 считается от канонического типизированного
        JSON. Все вопросы публикуются; published, shuffle и showScore тестов сохраняются. Импорт ограничен
        single; неизвестные поля и дубли JSON-ключей отклоняются. Исходный файл не сохраняется API.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportApplyInput'
      responses:
        '200':
          description: Прежняя квитанция повторного запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReceipt'
        '400':
          description: Неверный JSON или тело более 512 КиБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Сессия завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Требуются org_admin, Origin и CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Нужен application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 2 одновременных импорта; 30 запросов на аккаунт/организацию и 120 на IP за 15 минут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка; транзакция не применена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Атомарно созданы новые объекты; сохранена квитанция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReceipt'
        '409':
          description: Не совпадает проверенное содержимое, нет подтверждения или ID уже импортирован из
            другого файла; существующие данные не перезаписаны
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ImportFailure'
        '422':
          description: Файл содержит ошибки; ничего не импортировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFailure'

components:
  responses:
    Ready:
      description: База доступна, миграции применены
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Идентификатор запроса
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                const: ready
    Unavailable:
      description: База недоступна или миграции не завершены; сведения подключения
        не раскрываются
      content:
        application/json:
          schema:
            type: object
            required:
            - status
            - code
            properties:
              status:
                type: string
                const: unavailable
              code:
                type: string
                const: database_unavailable
    Error400:
      description: Некорректный JSON, поля или фильтр
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Требуется вход или сессия завершена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Недостаточно прав, неверный Origin или CSRF
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Объект не найден в своей организации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Конфликт, объект используется или версия устарела
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: Ожидается application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Ошибка проверки полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: 'Лимит повторов; для входа Retry-After: 900'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Ошибка сервера без раскрытия сведений БД
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hr_session
      description: HttpOnly cookie. Изменяющие запросы также требуют Origin и X-CSRF-Token
        из /me.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
      - code
      - message
    Me:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        csrf_token:
          type: string
          minLength: 64
          maxLength: 64
      required:
      - user_id
      - organization_id
      - organization_name
      - display_name
      - email
      - role
      - csrf_token
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024
          writeOnly: true
          description: Максимум 1024 UTF-8 байта
        organization_slug:
          type: string
          maxLength: 80
        second_factor:
          type: string
          maxLength: 64
          writeOnly: true
          description: 6 цифр TOTP либо одноразовый резервный код
      required:
      - email
      - password
    Category:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
      required:
      - id
      - name
      - description
    CategoryInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 2000
      required:
      - name
    Option:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 2000
        is_correct:
          type: boolean
        image_id:
          type: string
          description: UUID изображения своей организации или пустая строка; самостоятельного права доступа
            не даёт
      required:
      - label
      - is_correct
    QuestionInput:
      type: object
      additionalProperties: false
      properties:
        category_id:
          type: string
          description: UUID своей категории или пустая строка
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        type:
          type: string
          enum:
          - single_choice
          - multiple_choice
          - verbal_tfu
        body:
          type: string
          minLength: 1
          maxLength: 10000
        passage:
          type: string
          maxLength: 20000
        explanation:
          type: string
          maxLength: 10000
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/Option'
        base_version_no:
          type: integer
          minimum: 0
          description: Для новой редакции обязательный актуальный номер предыдущей версии
        image_id:
          type: string
          description: UUID изображения своей организации или пустая строка; самостоятельного права доступа
            не даёт
      required:
      - difficulty
      - type
      - body
      - options
    VersionInfo:
      type: object
      additionalProperties: false
      properties:
        version_no:
          type: integer
          minimum: 1
        status:
