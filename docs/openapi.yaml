openapi: 3.1.0
info:
  title: Кадровый тестер — HR API
  version: 0.9.0
  description: HR API, прохождение, отчёты, аудит и контролируемые правила хранения
    данных.
paths:
  /healthz:
    get:
      operationId: liveness
      summary: Проверка HTTP-процесса независимо от базы
      responses:
        '200':
          description: HTTP-процесс работает
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: ok
      security: []
  /readyz:
    get:
      operationId: readiness
      summary: Проверка базы и наличия последней миграции
      responses:
        '200':
          $ref: '#/components/responses/Ready'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /api/v1/status:
    get:
      operationId: workspaceStatus
      summary: Минимальный статус подключения для интерфейса
      responses:
        '200':
          $ref: '#/components/responses/Ready'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход сотрудника
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Точный origin интерфейса из APP_ORIGINS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Завершение текущей сессии
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Точный origin интерфейса из APP_ORIGINS
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Токен текущей сессии из /me
  /api/v1/me:
    get:
      operationId: me
      summary: Сотрудник, организация, роль и CSRF
      responses:
        '200':
          description: Успешно
