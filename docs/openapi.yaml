      description: 'Только org_admin своей организации. Нужны включённые правила.
        До 100 карточек и 1000 старых событий, только своей организации; ID списка
        привязан к автору и версии правил, срок 15 минут. Сохраняются только IDs и
        cutoff. Последняя активность кандидата: карточка/приглашение/попытка/согласие.
        Активные попытки, действующие ссылки, retention_hold, erasure_pending и уже
        очищенные карточки исключаются. Предпросмотр не удаляет данные.'
