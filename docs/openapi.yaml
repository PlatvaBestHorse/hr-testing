          - draft
          - published
        created_at:
          type: string
          format: date-time
      required:
      - version_no
      - status
      - created_at
    QuestionSaved:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
