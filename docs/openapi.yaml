      - email
      - display_name
      - role
      - status
    MemberInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        display_name:
          type: string
          minLength: 1
          maxLength: 250
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: Минимум 12 символов, максимум 1024 UTF-8 байта
      required:
      - email
      - display_name
      - role
      - password
    MemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - org_admin
          - recruiter
          - assessor
        status:
          type: string
          enum:
          - active
          - invited
          - disabled
      required:
      - role
      - status
    Summary:
      type: object
      additionalProperties: false
      properties:
        questions:
          type: integer
          minimum: 0
        tests:
          type: integer
          minimum: 0
        candidates:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0
      required:
      - questions
      - tests
      - candidates
      - attempts
    Question:
      type: object
      additionalProperties: false
      properties:
        category_id:
          type: string
          description: UUID своей категории или пустая строка
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        type:
          type: string
          enum:
          - single_choice
          - multiple_choice
          - verbal_tfu
        body:
          type: string
          minLength: 1
          maxLength: 10000
        passage:
          type: string
          maxLength: 20000
        explanation:
          type: string
          maxLength: 10000
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/Option'
        id:
