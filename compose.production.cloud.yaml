# Build-only overrides for the managed cloud proxy. No runtime proxy changes.
x-build: &cloud-build
  network: host
  secrets: [cloud_ca]
  extra_hosts:
    - "${HR_BUILD_PROXY_HOST:-proxy}=${HR_BUILD_PROXY_IP:?Source scripts/cloud_env.sh first}"
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
services:
  api:
    build: *cloud-build
  admin:
    build: *cloud-build
  backup:
    build: *cloud-build
  web:
    build: *cloud-build
secrets:
  cloud_ca:
    file: /etc/ssl/certs/ca-certificates.crt
