name: hr-testing

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_testing}
      POSTGRES_USER: ${POSTGRES_USER:-hr_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run make init first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hr_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hr_testing}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    # Local development: match the host user for the private test mailbox.
    user: "${API_UID:-1000}:${API_GID:-1000}"
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:5173,http://localhost:5173}
      DATABASE_URL: postgres://hr_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-hr_testing}?sslmode=disable
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Run make init first}
      AUTH_MAIL_MODE: ${AUTH_MAIL_MODE:-disabled}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:8088}
      AUTH_MAIL_DIR: /app/mailbox
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./.mailbox:/app/mailbox
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
